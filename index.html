const KEY='everframe_iconic_elena_answers_v1';let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let step=0;const fields=document.getElementById('fields');function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function render(){const s=sections[step];document.getElementById('counter').textContent=`Раздел ${step+1} из ${sections.length}`;document.getElementById('heading').textContent=s.title;document.getElementById('fill').style.width=((step+1)/sections.length*100)+'%';fields.innerHTML='';s.fields.forEach(([id,label,type,opts])=>{let d=document.createElement('div');d.className='field';let title=document.createElement('label');title.className='title';title.textContent=label;d.append(title);if(type==='multi'){opts.forEach(opt=>{let l=document.createElement('label');l.className='option';let input=document.createElement('input');input.type='checkbox';input.checked=(state[id]||[]).includes(opt);input.addEventListener('change',()=>{let v=new Set(state[id]||[]);input.checked?v.add(opt):v.delete(opt);state[id]=[...v];persist()});let t=document.createElement('span');t.textContent=opt;l.append(input,t);d.append(l)})}else{let el=type==='textarea'?document.createElement('textarea'):type==='select'?document.createElement('select'):document.createElement('input');if(type==='select'){let placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Выберите вариант';el.append(placeholder);opts.forEach(x=>{let o=document.createElement('option');o.textContent=x;o.value=x;el.append(o)})}else if(type!=='textarea'){el.type=type}el.value=state[id]||'';el.addEventListener('input',()=>{state[id]=el.value;persist()});d.append(el)}fields.append(d)});document.getElementById('back').style.visibility=step===0?'hidden':'visible';document.getElementById('next').textContent=step===sections.length-1?'Завершить':'Далее'}function exportText(){let lines=['АНКЕТА ЕЛЕНЫ — EVERFRAME ICONIC CRM','Дата: '+new Date().toLocaleDateString('ru-RU'),''];sections.forEach(s=>{lines.push('=== '+s.title+' ===');s.fields.forEach(([id,label])=>lines.push(label+'\n'+(Array.isArray(state[id])?state[id].join(', '):(state[id]||'—'))+'\n'))});return lines.join('\n')}function download(){const blob=new Blob([exportText()],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='anketa_elena_iconic.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function finish(){document.getElementById('counter').textContent='Готово';document.getElementById('heading').textContent='Спасибо, Елена!';fields.innerHTML='';let d=document.createElement('div');d.className='success';d.textContent='Ваши ответы сохранены на этом устройстве. Чтобы передать их разработчикам, нажмите «Поделиться ответами» или «Сохранить файл». Автоматическая отправка пока не подключена.';fields.append(d);let share=document.createElement('button');share.className='primary';share.style.width='100%';share.style.marginTop='15px';share.textContent='Поделиться ответами';share.onclick=async()=>{let text=exportText();if(navigator.share){try{await navigator.share({title:'Анкета Елены — ICONIC CRM',text});return}catch(e){if(e.name==='AbortError')return}}if(navigator.clipboard){try{await navigator.clipboard.writeText(text);alert('Ответы скопированы. Отправьте их в Telegram.');return}catch(e){}}download()};fields.append(share);let save=document.createElement('button');save.className='secondary';save.style.width='100%';save.style.marginTop='10px';save.textContent='Сохранить файл с ответами';save.onclick=download;fields.append(save);document.getElementById('back').style.visibility='visible';document.getElementById('next').style.display='none';document.getElementById('back').textContent='Изменить ответы'}document.getElementById('back').onclick=()=>{if(document.getElementById('next').style.display==='none'){document.getElementById('next').style.display='';document.getElementById('back').textContent='Назад';render()}else if(step>0){step--;render()}};document.getElementById('next').onclick=()=>{if(step<sections.length-1){step++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()};render();
